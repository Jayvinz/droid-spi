<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#64748b"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="#f8fafc"/>

  <!-- app -->
  <rect x="360" y="40" width="240" height="70" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="480" y="72" text-anchor="middle" font-size="17" font-weight="600" fill="#1e293b">:app</text>
  <text x="480" y="94" text-anchor="middle" font-size="12" fill="#475569">assembles every module</text>

  <!-- contract -->
  <rect x="60" y="220" width="250" height="110" rx="10" fill="#ecfdf5" stroke="#0d9488" stroke-width="2"/>
  <text x="185" y="252" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">:core:contract</text>
  <text x="185" y="278" text-anchor="middle" font-size="13" fill="#0f766e">interface FeedSource</text>
  <text x="185" y="300" text-anchor="middle" font-size="13" fill="#0f766e">interface ProductionEntry</text>
  <text x="185" y="320" text-anchor="middle" font-size="11" fill="#64748b">base module, always installed</text>

  <!-- feature-feed -->
  <rect x="650" y="150" width="260" height="100" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="780" y="180" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">:feature:feed</text>
  <text x="780" y="205" text-anchor="middle" font-size="13" fill="#475569">module B</text>
  <text x="780" y="228" text-anchor="middle" font-size="12" fill="#64748b">wants to open the create screen</text>

  <!-- feature-production -->
  <rect x="650" y="320" width="260" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="780" y="352" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">:feature:production</text>
  <text x="780" y="376" text-anchor="middle" font-size="13" fill="#92400e">module A · dynamic feature</text>
  <text x="780" y="398" text-anchor="middle" font-size="12" fill="#b45309">ProductionEntryImpl</text>
  <text x="780" y="420" text-anchor="middle" font-size="11" fill="#b45309">may NOT be installed yet</text>

  <!-- allowed deps -->
  <line x1="720" y1="250" x2="240" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="242" text-anchor="middle" font-size="11" fill="#64748b">depends on contract</text>

  <line x1="720" y1="322" x2="250" y2="318" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="475" y="338" text-anchor="middle" font-size="11" fill="#64748b">depends on contract</text>

  <!-- dynamic-feature link routed around the right margin -->
  <path d="M 585 100 H 935 V 360 H 914" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="760" y="92" text-anchor="middle" font-size="11" fill="#64748b">dynamic-feature link</text>

  <!-- forbidden dep -->
  <line x1="780" y1="252" x2="780" y2="318" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <line x1="768" y1="273" x2="792" y2="297" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="792" y1="273" x2="768" y2="297" stroke="#dc2626" stroke-width="2.5"/>
  <text x="756" y="272" text-anchor="end" font-size="12" font-weight="600" fill="#dc2626">needs openCreate()</text>
  <text x="756" y="292" text-anchor="end" font-size="12" fill="#dc2626">dependency forbidden</text>

  <!-- callout -->
  <rect x="60" y="470" width="850" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="485" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Module B needs module A's capability, but B may not depend on A.</text>
  <text x="485" y="524" text-anchor="middle" font-size="13" fill="#b91c1c">Worse: A lives in an on-demand split. The user may not have downloaded it, so A is not in the process yet.</text>
  <text x="485" y="544" text-anchor="middle" font-size="12" fill="#b91c1c">Class.forName? Hand-rolled registry? DI graph? All three break here.</text>
</svg>
