name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches spiVersion
        run: |
          version="$(grep '^spiVersion=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match spiVersion=$version" >&2
            exit 1
          fi

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :annotation:publish :runtime:publish :plugin:publish --configure-on-demand

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            annotation/build/libs/*.jar
            plugin/build/libs/*.jar
            runtime/build/outputs/aar/*.aar
          fail_on_unmatched_files: false
