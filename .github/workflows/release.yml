name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches spiVersion
        run: |
          version="$(grep '^spiVersion=' gradle.properties | cut -d= -f2)"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match spiVersion=$version" >&2
            exit 1
          fi

      - name: Check release secrets
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          missing=0
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD SIGNING_KEY SIGNING_PASSWORD \
                      GRADLE_PUBLISH_KEY GRADLE_PUBLISH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      # These artifacts go to Maven Central. Signing is enabled by SIGNING_KEY; without it
      # Central would reject the bundle.
      - name: Publish signed artifacts to the local repository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :annotation:publish :runtime:publish --configure-on-demand

      # The Gradle plugin is published to the Gradle Plugin Portal, not to Central.
      - name: Publish the Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins --configure-on-demand

      - name: Bundle the Maven Central artifacts
        run: |
          mkdir -p build/central-bundle/top/jayvin/droidspi
          cp -R local-repo/top/jayvin/droidspi/annotation build/central-bundle/top/jayvin/droidspi/
          cp -R local-repo/top/jayvin/droidspi/runtime build/central-bundle/top/jayvin/droidspi/
          # Central requires md5 + sha1 for every file, so keep the checksums that the local
          # publication generated; only stale repository metadata has to go.
          find build/central-bundle -type f -name 'maven-metadata.xml*' -delete
          (cd build/central-bundle && zip -qr ../central-bundle.zip top)

      - name: Upload the bundle to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 -w0)"
          version="${GITHUB_REF_NAME#v}"
          deployment_id="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $token" \
            --form bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=droid-spi-${version}&publishingType=AUTOMATIC")"
          echo "Deployment id: $deployment_id"

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --request POST \
              --header "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment_id")"
            state="$(echo "$status" | jq -r '.deploymentState')"
            echo "Deployment state: $state"
            case "$state" in
              PUBLISHED)
                exit 0
                ;;
              FAILED)
                echo "$status" | jq .
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Maven Central deployment did not finish in time"
          exit 1

      - name: Attach artifacts to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            annotation/build/libs/*.jar
            plugin/build/libs/*.jar
            runtime/build/outputs/aar/*.aar
          fail_on_unmatched_files: false
